[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[project]
name = "autofv"
version = "0.1.0"
description = "Sealed formal-verification experiment runner"
requires-python = "==3.12.*"
dependencies = [
  "cryptography==50.0.1",
  "langgraph==1.2.11",
]

[project.scripts]
autofv = "autofv.experiment:main"

[tool.uv.build-backend]
module-root = ""
